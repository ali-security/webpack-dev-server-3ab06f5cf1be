name: webpack-dev-server

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional jest test name/path filter"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  lint:
    name: Lint - ${{ matrix.os }} - Node v${{ matrix.node-version }}

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [16.x]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build types
        run: npm run build:types

      - name: Check types
        run: if [ -n "$(git status types --porcelain)" ]; then echo "Missing types. Update types by running 'npm run build:types'"; exit 1; else echo "All types are valid"; fi

  test:
    name: Test - ${{ matrix.os }} - Node v${{ matrix.node-version }}, Webpack ${{ matrix.webpack-version }} (${{ matrix.shard }})

    strategy:
      # One flaky leg must not cancel the other 50; every leg reports its own result.
      fail-fast: false
      matrix:
        # windows-2022 is the image `windows-latest` resolved to at the 4.15.2
        # release. Today's default (Windows Server 2025) dropped wmic, so
        # `default-gateway`/`internal-ip` return nothing and every CLI stderr
        # snapshot loses its "On Your Network" lines. Pinning the release-era image
        # keeps the whole Windows matrix running instead of skipping those tests.
        os: [ubuntu-latest, windows-2022, macos-latest]
        node-version: [12.x, 14.x, 16.x, 18.x, 19.x]
        shard: ["1/4", "2/4", "3/4", "4/4"]
        webpack-version: [latest]
        include:
          - node-version: 16.x
            os: ubuntu-latest
            webpack-version: 4
        exclude:
          # Node.js < 16 has no darwin-arm64 build and macos-latest runners are Apple
          # Silicon, so setup-node cannot provision these. Kept on ubuntu/windows (x64).
          - os: macos-latest
            node-version: 12.x
          - os: macos-latest
            node-version: 14.x

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Pack npm tarball
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '16.x' && matrix.webpack-version == 'latest' && matrix.shard == '1/4'
        run: npm pack

      - name: Upload npm tarball
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '16.x' && matrix.webpack-version == 'latest' && matrix.shard == '1/4'
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: webpack-dev-server-*.tgz
          if-no-files-found: error

      - name: Update package.json for webpack@4
        if: matrix.webpack-version == '4'
        run: echo "`jq '.scripts.build="npm run build:client"' package.json`" > package.json

      - name: Install webpack ${{ matrix.webpack-version }}
        if: matrix.webpack-version == '4'
        run: npm i webpack@${{ matrix.webpack-version }} --save-dev --ignore-scripts

      - name: Setup firefox
        if: matrix.os != 'windows-2022'
        uses: browser-actions/setup-firefox@latest
        with:
          firefox-version: latest

      - name: Link webpack-dev-server
        run: |
          cp -R client tmp-client
          npm link --ignore-scripts
          npm link webpack-dev-server --ignore-scripts
          rm -r client
          cp -R tmp-client client

      - name: Run tests for webpack version ${{ matrix.webpack-version }}
        run: npm run test:coverage -- --ci --shard=${{ matrix.shard }} ${{ inputs.test-filter }}
